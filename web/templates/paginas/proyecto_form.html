{{define "titulo"}}{{.Datos.Titulo}}{{end}}

{{define "contenido"}}
<div class="encabezado">
  <hgroup>
    <h1>{{.Datos.Titulo}}</h1>
    <p>Nombre, descripción y fechas del proyecto.</p>
  </hgroup>
</div>

<form method="post" action="{{.Datos.Accion}}">
  {{- with .Datos.Error}}
  <p class="error-formulario" role="alert">{{.}}</p>
  {{- end}}
  <label>
    Nombre
    <input name="nombre" value="{{.Datos.Nombre}}" required>
  </label>
  <label>
    Descripción (opcional)
    <textarea name="descripcion" rows="3">{{.Datos.Descripcion}}</textarea>
  </label>
  <div class="grid">
    <label>
      Fecha de inicio
      <input type="date" name="inicio" value="{{.Datos.Inicio}}" required>
    </label>
    <label>
      Fecha de fin
      <input type="date" name="fin" value="{{.Datos.Fin}}" required>
    </label>
  </div>
  <button type="submit">{{.Datos.Boton}}</button>
</form>

<p><a href="/proyectos">Volver a la lista de proyectos</a></p>
{{end}}
