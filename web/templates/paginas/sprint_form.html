{{define "titulo"}}Nuevo sprint{{end}}

{{define "contenido"}}
<h1>Nuevo sprint</h1>

<form method="post" action="/sprints">
  {{- with .Datos.Error}}
  <p class="error-formulario" role="alert">{{.}}</p>
  {{- end}}
  <label>
    Proyecto
    <select name="proyecto" required>
      {{- range .Datos.Proyectos}}
      <option value="{{.ID}}"{{if eq .ID $.Datos.Proyecto}} selected{{end}}>{{.Nombre}}</option>
      {{- end}}
    </select>
  </label>
  <label>
    Sprint Goal
    <input name="goal" value="{{.Datos.Goal}}" required>
  </label>
  <div class="grid">
    <label>
      Fecha de inicio
      <input type="date" name="inicio" value="{{.Datos.Inicio}}" required>
    </label>
    <label>
      Fecha de fin
      <input type="date" name="fin" value="{{.Datos.Fin}}" required>
    </label>
  </div>
  <button type="submit">Crear sprint</button>
</form>

<p><a href="/sprints">Volver a la lista de sprints</a></p>
{{end}}
