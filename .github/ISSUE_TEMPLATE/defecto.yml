name: Defecto
description: Reportar un error encontrado en la aplicación
title: "DEF-XX · <descripción corta>"
labels: ["tipo:defecto"]
body:
  - type: textarea
    id: descripcion
    attributes:
      label: Descripción
      description: Qué pasa y qué debería pasar.
    validations:
      required: true
  - type: textarea
    id: pasos
    attributes:
      label: Pasos para reproducirlo
      value: |
        1.
        2.
    validations:
      required: true
  - type: dropdown
    id: severidad
    attributes:
      label: Severidad
      options: ["Crítica", "Alta", "Media", "Baja"]
    validations:
      required: true
  - type: input
    id: historia
    attributes:
      label: Historia relacionada
      placeholder: "HU-XX (#N)"
  - type: dropdown
    id: sprint-deteccion
    attributes:
      label: Sprint de detección
      options: ["Sprint 1", "Sprint 2", "Sprint 3", "Sprint 4"]
    validations:
      required: true
