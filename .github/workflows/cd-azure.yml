# Despliegue continuo en Azure Container Apps (TEC-23, ADR 0005). Seguridad: TEC-24.
#
# Construye la imagen de la app y la del proxy, las publica en el registro de la cátedra con la etiqueta sha-<commit>,
# despliega por digest y prueba que la app responda. Solo crea, cambia o borra lo que empieza con grupo02- (A12).
#
# Secretos del Environment `azure` (nunca en archivos ni en logs, A3): AZURE_CREDENTIALS, ACR_PASSWORD y
# WRITE_PASSWORD_HASH. Si falta alguno, construye las imágenes para validarlas y termina en verde sin publicar.
name: CD Azure

on:
  push:
    branches: [main]
    paths:
      - "cmd/**"
      - "internal/**"
      - "web/**"
      - "go.mod"
      - "go.sum"
      - "Dockerfile"
      - ".dockerignore"
      - "deploy/**"
      - ".github/workflows/cd-azure.yml"
  # A mano: "Run workflow" eligiendo la rama (main, o la del PR mientras el Environment la permita).
  workflow_dispatch:

# Nunca en pull_request ni pull_request_target: un PR no puede correr código con los secretos (A4).
permissions:
  contents: read

# Un despliegue por vez; el siguiente espera en lugar de cortar uno a medias.
concurrency:
  group: cd-azure
  cancel-in-progress: false

env:
  CONTAINER_APP_NAME: grupo02-seguimiento-medicion
  IMAGEN_APP: grupo02-seguimiento-medicion
  IMAGEN_PROXY: grupo02-proxy
  ACR_NAME: ingcalidad2026
  ACR_LOGIN_SERVER: ingcalidad2026.azurecr.io
  AZURE_RESOURCE_GROUP: frsrutn
  AZURE_CONTAINERAPPS_ENVIRONMENT: utnapp-env
  AZURE_LOCATION: switzerlandnorth

jobs:
  # 1. ¿Están los secretos? Si falta alguno, se construye sin publicar.
  configuracion:
    runs-on: ubuntu-latest
    environment: azure
    outputs:
      publicar: ${{ steps.secretos.outputs.publicar }}
    steps:
      - name: Verificar los secretos
        id: secretos
        env:
          AZURE_CREDENTIALS: ${{ secrets.AZURE_CREDENTIALS }}
          ACR_PASSWORD: ${{ secrets.ACR_PASSWORD }}
          WRITE_PASSWORD_HASH: ${{ secrets.WRITE_PASSWORD_HASH }}
        run: |
          faltan=""
          [ -n "$AZURE_CREDENTIALS" ] || faltan="$faltan AZURE_CREDENTIALS"
          [ -n "$ACR_PASSWORD" ] || faltan="$faltan ACR_PASSWORD"
          [ -n "$WRITE_PASSWORD_HASH" ] || faltan="$faltan WRITE_PASSWORD_HASH"
          if [ -n "$faltan" ]; then
            echo "::warning::Faltan secretos del Environment azure:$faltan. Se construyen las imágenes sin publicar."
            echo "publicar=false" >> "$GITHUB_OUTPUT"
          else
            echo "publicar=true" >> "$GITHUB_OUTPUT"
          fi

  # TEC-24 (Lara): job `vulnerabilidades` con govulncheck y Go 1.26 (A6). `imagen` lo necesita para publicar.

  # 2. Construye las dos imágenes y, si hay secretos, las publica. Devuelve sus digests (A5).
  imagen:
    needs: [configuracion]
    runs-on: ubuntu-latest
    environment: azure
    outputs:
      digest-app: ${{ steps.app.outputs.digest }}
      digest-proxy: ${{ steps.proxy.outputs.digest }}
      csp-script-hash: ${{ steps.csp.outputs.hash }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Hash del script del dashboard para la CSP
        id: csp
        run: echo "hash=$(sh deploy/csp-hash.sh)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Entrar al registro
        if: needs.configuracion.outputs.publicar == 'true'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ${{ env.ACR_LOGIN_SERVER }}
          username: ${{ env.ACR_NAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Imagen de la app
        id: app
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          push: ${{ needs.configuracion.outputs.publicar == 'true' }}
          tags: ${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGEN_APP }}:sha-${{ github.sha }}
          provenance: false

      - name: Imagen del proxy
        id: proxy
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: deploy
          file: deploy/proxy/Dockerfile
          push: ${{ needs.configuracion.outputs.publicar == 'true' }}
          tags: ${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGEN_PROXY }}:sha-${{ github.sha }}
          provenance: false

  # 3. Despliega por digest, prueba que responda y deja la URL en el resumen.
  desplegar:
    needs: [configuracion, imagen]
    if: needs.configuracion.outputs.publicar == 'true'
    runs-on: ubuntu-latest
    environment: azure
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2.3.1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Crear el entorno si no existe (nunca se borra)
        run: |
          az containerapp env show -g "$AZURE_RESOURCE_GROUP" -n "$AZURE_CONTAINERAPPS_ENVIRONMENT" >/dev/null 2>&1 || \
            az containerapp env create -g "$AZURE_RESOURCE_GROUP" -n "$AZURE_CONTAINERAPPS_ENVIRONMENT" \
              -l "$AZURE_LOCATION" --logs-destination none

      - name: Armar la plantilla con los digests y los secretos
        env:
          IMAGEN_APP: ${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGEN_APP }}@${{ needs.imagen.outputs.digest-app }}
          IMAGEN_PROXY: ${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGEN_PROXY }}@${{ needs.imagen.outputs.digest-proxy }}
          CSP_SCRIPT_HASH: ${{ needs.imagen.outputs.csp-script-hash }}
          ACR_PASSWORD: ${{ secrets.ACR_PASSWORD }}
          WRITE_PASSWORD_HASH: ${{ secrets.WRITE_PASSWORD_HASH }}
        run: |
          ENTORNO_ID=$(az containerapp env show -g "$AZURE_RESOURCE_GROUP" -n "$AZURE_CONTAINERAPPS_ENVIRONMENT" --query id -o tsv)
          export ENTORNO_ID
          # Solo se reemplazan estos marcadores; el archivo queda en $RUNNER_TEMP y se borra al terminar.
          # La lista va entre comillas simples a propósito: envsubst la recibe textual, sin expandir.
          # shellcheck disable=SC2016
          envsubst '${ENTORNO_ID} ${IMAGEN_APP} ${IMAGEN_PROXY} ${CSP_SCRIPT_HASH} ${ACR_PASSWORD} ${WRITE_PASSWORD_HASH}' \
            < deploy/containerapp.yaml > "$RUNNER_TEMP/containerapp.yaml"

      - name: Crear o actualizar la app
        run: |
          if az containerapp show -g "$AZURE_RESOURCE_GROUP" -n "$CONTAINER_APP_NAME" >/dev/null 2>&1; then
            az containerapp update -g "$AZURE_RESOURCE_GROUP" -n "$CONTAINER_APP_NAME" \
              --yaml "$RUNNER_TEMP/containerapp.yaml" -o none
          else
            az containerapp create -g "$AZURE_RESOURCE_GROUP" -n "$CONTAINER_APP_NAME" \
              --environment "$AZURE_CONTAINERAPPS_ENVIRONMENT" --yaml "$RUNNER_TEMP/containerapp.yaml" -o none
          fi

      - name: Borrar la plantilla con secretos
        if: always()
        run: rm -f "$RUNNER_TEMP/containerapp.yaml"

      - name: Prueba de humo
        id: humo
        run: |
          fqdn=$(az containerapp show -g "$AZURE_RESOURCE_GROUP" -n "$CONTAINER_APP_NAME" \
            --query properties.configuration.ingress.fqdn -o tsv)
          echo "url=https://$fqdn" >> "$GITHUB_OUTPUT"
          # Hasta 3 minutos: el primer pedido puede tardar por el arranque en frío.
          for intento in $(seq 1 36); do
            salud=$(curl -fsS --max-time 10 "https://$fqdn/health" || true)
            if [ "$salud" = '{"estado":"ok"}' ] && curl -fsS --max-time 10 "https://$fqdn/backlog" | grep -q "Software Metrics"; then
              echo "La app responde y tiene los datos de la demo (intento $intento)."
              exit 0
            fi
            sleep 5
          done
          echo "::error::La app no respondió /health o /backlog no muestra el proyecto de la demo en 3 minutos."
          exit 1

      # TEC-24 (Lara): pruebas de seguridad de la prueba de humo (POST sin clave → 401, cabeceras, http → https).

      - name: Logs de la réplica si falló
        if: failure()
        run: |
          for c in app proxy; do
            echo "::group::Logs de $c"
            az containerapp logs show -g "$AZURE_RESOURCE_GROUP" -n "$CONTAINER_APP_NAME" --container "$c" --tail 100 || true
            echo "::endgroup::"
          done

      - name: URL en el resumen
        if: success()
        run: |
          {
            echo "### App desplegada"
            echo ""
            echo "${{ steps.humo.outputs.url }}"
            echo ""
            echo "Imagen de la app: \`${{ needs.imagen.outputs.digest-app }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Limpiar el registro (quedan las 5 últimas de cada imagen grupo02-)
        if: success()
        env:
          ACR_PASSWORD: ${{ secrets.ACR_PASSWORD }}
        run: |
          for repo in "$IMAGEN_APP" "$IMAGEN_PROXY"; do
            az acr repository show-tags -n "$ACR_NAME" --repository "$repo" --orderby time_desc -o tsv \
                --username "$ACR_NAME" --password "$ACR_PASSWORD" | tail -n +6 | while read -r etiqueta; do
              az acr repository delete -n "$ACR_NAME" --image "$repo:$etiqueta" --yes \
                --username "$ACR_NAME" --password "$ACR_PASSWORD" -o none
            done
          done
