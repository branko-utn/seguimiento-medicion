# Integración continua: cada Pull Request y cada push a main pasa por las validaciones de la Definition of Done.
# Es un check obligatorio para mergear en main.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# Si se sube otro commit al mismo PR, se cancela la corrida anterior.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  calidad:
    name: Calidad (formato, análisis, tests y BDD)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Formato (gofmt)
        run: |
          sin_formato=$(gofmt -l .)
          if [ -n "$sin_formato" ]; then
            echo "::error::Estos archivos no tienen formato; corré 'gofmt -w .' (o 'make fmt') y volvé a subirlos:"
            echo "$sin_formato"
            exit 1
          fi

      - name: Análisis estático (go vet)
        run: go vet ./...

      - name: Tests unitarios con race detector y cobertura
        run: go test -race -covermode=atomic -coverprofile=coverage.out $(go list ./... | grep -v /features)

      - name: Escenarios BDD (godog)
        run: go test ./features/ -v

      - name: Resumen de cobertura
        if: always()
        run: |
          if [ -f coverage.out ]; then
            {
              echo "### Cobertura por función"
              echo '```'
              go tool cover -func=coverage.out
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
